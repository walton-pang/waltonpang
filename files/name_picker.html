<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive 3D Name Spinner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 3vw, 32px);
    }

    .container {
      display: flex;
      flex-direction: row;
      gap: clamp(20px, 4vw, 48px);
      max-width: 1300px;
      width: 100%;
      height: min(90vh, 850px);
      background: var(--card-bg);
      padding: clamp(20px, 4vw, 48px);
      border-radius: clamp(16px, 3vw, 32px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        height: auto;
      }
    }

    .wheel-section {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      min-height: 280px;
    }

    /* Canvas container slightly resized */
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 20px rgba(0,0,0,0.5));
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .pointer {
      position: absolute;
      top: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: clamp(12px, 2.2vw, 22px) solid transparent;
      border-right: clamp(12px, 2.2vw, 22px) solid transparent;
      border-top: clamp(24px, 4.4vw, 44px) solid #ef4444;
      z-index: 10;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
      transform-origin: 50% 0%;
      transition: transform 0.05s ease;
    }

    .pointer.click {
      transform: translateX(-50%) rotate(-14deg);
    }

    .spin-btn {
      margin-top: clamp(16px, 2.5vw, 28px);
      padding: clamp(12px, 1.8vw, 18px) clamp(36px, 4.5vw, 56px);
      font-size: clamp(1.1rem, 2.2vw, 1.5rem);
      font-weight: 800;
      letter-spacing: 1px;
      color: white;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(99, 102, 241, 0.6);
    }

    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .controls-section {
      flex: 0.8;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    h2 {
      font-size: clamp(1.3rem, 2.5vw, 2rem);
      font-weight: 700;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: clamp(0.85rem, 1.5vw, 1.05rem);
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 180px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 16px;
      color: var(--text);
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .winner-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .winner-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .winner-card {
      background: var(--card-bg);
      padding: clamp(24px, 5vw, 56px);
      border-radius: 28px;
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.3s ease;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      max-width: 90%;
      width: 500px;
    }

    .winner-modal.active .winner-card {
      transform: scale(1);
    }

    .winner-card h3 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
    }

    .winner-name {
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 900;
      color: #38bdf8;
      margin: 20px 0;
      word-break: break-word;
    }

    .close-btn {
      padding: 12px 32px;
      font-size: clamp(1rem, 2vw, 1.2rem);
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="wheel-section">
      <div id="canvasWrapper" class="canvas-container">
        <div id="pointer" class="pointer"></div>
        <canvas id="wheel"></canvas>
      </div>
      <button id="spinBtn" class="spin-btn">SPIN!</button>
    </div>

    <div class="controls-section">
      <h2>Students List</h2>
      <p class="subtitle">Enter one student name per line:</p>
      <textarea id="namesInput" placeholder="Enter names here...">Alex&#10;Jordan&#10;Taylor&#10;Morgan&#10;Sam&#10;Chris&#10;Pat&#10;Riley</textarea>
    </div>
  </div>

  <div id="winnerModal" class="winner-modal">
    <div class="winner-card">
      <h3>🎉 We have a winner! 🎉</h3>
      <div id="winnerName" class="winner-name"></div>
      <button id="closeModal" class="close-btn">Close</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const spinBtn = document.getElementById('spinBtn');
    const namesInput = document.getElementById('namesInput');
    const winnerModal = document.getElementById('winnerModal');
    const winnerNameEl = document.getElementById('winnerName');
    const closeModal = document.getElementById('closeModal');
    const pointerEl = document.getElementById('pointer');

    let names = [];
    let currentAngle = 0;
    let isSpinning = false;
    let audioCtx = null;

    let canvasSize = 450;
    let center = 225;
    let radius = 175; // Wheel reduced to ~39% of canvas width for better spacing
    let height3D = 24;

    const colors = [
      '#3b82f6', '#ec4899', '#10b981', '#f59e0b', 
      '#8b5cf6', '#06b6d4', '#f97316', '#84cc16'
    ];

    const resizeObserver = new ResizeObserver(entries => {
      for (let entry of entries) {
        const size = Math.floor(entry.contentRect.width);
        if (size > 0) {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = size * dpr;
          canvas.height = size * dpr;
          ctx.scale(dpr, dpr);

          canvasSize = size;
          center = size / 2;
          radius = size * 0.39; // Slightly smaller wheel radius
          height3D = size * 0.045;

          drawWheel();
        }
      }
    });

    resizeObserver.observe(canvasWrapper);

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playClickSound() {
      initAudio();
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.015);

      oscGain.gain.setValueAtTime(0.3, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);

      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);

      const bufferSize = audioCtx.sampleRate * 0.01;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;

      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 3000;

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.25, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.01);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.015);
      noise.start(now);
      noise.stop(now + 0.01);

      pointerEl.classList.add('click');
      setTimeout(() => pointerEl.classList.remove('click'), 40);
    }

    function playWinSound() {
      initAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, index) => {
        const now = audioCtx.currentTime + index * 0.1;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.3);
      });
    }

    function getNames() {
      return namesInput.value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n.length > 0);
    }

    function adjustColor(hex, factor) {
      let num = parseInt(hex.replace("#", ""), 16),
          r = Math.floor((num >> 16) * factor),
          g = Math.floor(((num >> 8) & 0x00FF) * factor),
          b = Math.floor((num & 0x0000FF) * factor);
      return `rgb(${r},${g},${b})`;
    }

    // Returns index of slice currently directly under top pointer
    function getSliceAtPointer() {
      if (names.length === 0) return 0;
      const sliceAngle = (2 * Math.PI) / names.length;
      
      // Pointer is at -90deg (top of the canvas)
      const pointerPosition = -Math.PI / 2;
      
      // Normalize angle to [0, 2PI)
      let angle = (pointerPosition - currentAngle) % (2 * Math.PI);
      if (angle < 0) angle += 2 * Math.PI;

      return Math.floor(angle / sliceAngle) % names.length;
    }

    function drawWheel() {
      names = getNames();
      ctx.clearRect(0, 0, canvasSize, canvasSize);

      if (names.length === 0) return;

      const sliceAngle = (2 * Math.PI) / names.length;

      // 3D Extruded Base
      for (let i = 0; i < names.length; i++) {
        const start = currentAngle + i * sliceAngle;
        const end = start + sliceAngle;
        const baseColor = colors[i % colors.length];
        const darkColor = adjustColor(baseColor, 0.6);

        ctx.beginPath();
        ctx.arc(center, center + height3D, radius, start, end);
        ctx.arc(center, center, radius, end, start, true);
        ctx.closePath();
        ctx.fillStyle = darkColor;
        ctx.fill();
      }

      // Base Shadow
      ctx.beginPath();
      ctx.arc(center, center + height3D, radius, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fill();

      // Top Slices
      for (let i = 0; i < names.length; i++) {
        const start = currentAngle + i * sliceAngle;
        const end = start + sliceAngle;

        const grad = ctx.createRadialGradient(center, center, 0, center, center, radius);
        grad.addColorStop(0, '#ffffff33');
        grad.addColorStop(0.7, colors[i % colors.length]);
        grad.addColorStop(1, adjustColor(colors[i % colors.length], 0.85));

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = '#ffffff33';
        ctx.lineWidth = Math.max(1, canvasSize * 0.004);
        ctx.stroke();

        // Font scaling
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";

        const baseFontSize = canvasSize * 0.042;
        const fontSize = Math.max(11, Math.min(baseFontSize, (canvasSize * 0.42) / names.length));
        
        ctx.font = `bold ${fontSize}px system-ui, sans-serif`;
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 4;

        let displayName = names[i];
        if (displayName.length > 16) {
          displayName = displayName.substring(0, 14) + '…';
        }

        ctx.fillText(displayName, radius - (canvasSize * 0.045), fontSize / 3);
        ctx.restore();
      }

      // Center Cap
      const capRadius = canvasSize * 0.065;
      ctx.beginPath();
      ctx.arc(center, center, capRadius, 0, 2 * Math.PI);
      const capGrad = ctx.createLinearGradient(center - capRadius, center - capRadius, center + capRadius, center + capRadius);
      capGrad.addColorStop(0, '#ffffff');
      capGrad.addColorStop(0.5, '#cbd5e1');
      capGrad.addColorStop(1, '#64748b');
      ctx.fillStyle = capGrad;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(2, canvasSize * 0.008);
      ctx.stroke();
    }

    function spin() {
      if (isSpinning || names.length === 0) return;

      initAudio();
      isSpinning = true;
      spinBtn.disabled = true;

      const spinAngle = Math.PI * 2 * (7 + Math.random() * 4);
      const duration = 8500;
      const startTime = performance.now();
      const startAngle = currentAngle;

      let lastSliceIndex = getSliceAtPointer();

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // 7th order easing function for long, slow crawl at the end
        const easeOutSeptic = 1 - Math.pow(1 - progress, 7);
        
        currentAngle = startAngle + spinAngle * easeOutSeptic;
        drawWheel();

        const currentSliceIndex = getSliceAtPointer();

        if (currentSliceIndex !== lastSliceIndex) {
          playClickSound();
          lastSliceIndex = currentSliceIndex;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          playWinSound();
          showWinner(names[currentSliceIndex]);
        }
      }

      requestAnimationFrame(animate);
    }

    function showWinner(name) {
      winnerNameEl.textContent = name;
      winnerModal.classList.add('active');
    }

    closeModal.addEventListener('click', () => {
      winnerModal.classList.remove('active');
    });

    namesInput.addEventListener('input', drawWheel);
    spinBtn.addEventListener('click', spin);
  </script>
</body>
</html>
